<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1135" role="img" aria-labelledby="title desc"><title id="title">Framework for identifying and explaining ghost recruitment</title><desc id="desc">Measurement, operating validation and three potential determinants, with the worker-start extension marked separately.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#b12d35"/></marker></defs><rect width="960" height="1135" fill="white"/><text x="20" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#24282b">Research framework</text><text x="655" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#24282b">Evidence and data</text><rect x="20" y="48" width="920" height="100" rx="12" fill="#e9f2f0" stroke="#6c7277"/><text x="35" y="75" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Central question</text><text x="35" y="100" font-family="Georgia,serif" font-size="17" fill="#24282b">Can applicants’ accounts identify unavailable jobs and explain when recruitment signals translate less</text><text x="35" y="122" font-family="Georgia,serif" font-size="17" fill="#24282b">closely into business growth?</text><rect x="20" y="173" width="575" height="140" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="35" y="200" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">1. Identify ghost recruitment</text><text x="35" y="225" font-family="Georgia,serif" font-size="17" fill="#24282b">Extract fourteen features; eleven form the broad score. Explicit</text><text x="35" y="247" font-family="Georgia,serif" font-size="17" fill="#24282b">unavailable-role reports form a narrower score. Offers receive</text><text x="35" y="269" font-family="Georgia,serif" font-size="17" fill="#24282b">zero flags.</text><rect x="655" y="173" width="285" height="140" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="670" y="200" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Separate-review check</text><text x="670" y="225" font-family="Georgia,serif" font-size="17" fill="#24282b">Score in one group; reports in</text><text x="670" y="247" font-family="Georgia,serif" font-size="17" fill="#24282b">another: 5.6% versus 3.6%.</text><text x="670" y="269" font-family="Georgia,serif" font-size="17" fill="#24282b">Repeat in Revelio reviews.</text><path d="M594,243 L650,243" fill="none" stroke="#b12d35" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/><rect x="20" y="345" width="575" height="150" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="35" y="372" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">2. Connect recruitment to operations</text><text x="35" y="397" font-family="Georgia,serif" font-size="17" fill="#24282b">Following Gutiérrez, Lourie et al., interact actual posting</text><text x="35" y="419" font-family="Georgia,serif" font-size="17" fill="#24282b">growth with the ghost score. Interview rounds provide a</text><text x="35" y="441" font-family="Georgia,serif" font-size="17" fill="#24282b">supplementary activity proxy.</text><rect x="655" y="345" width="285" height="150" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="670" y="372" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Operating comparisons</text><text x="670" y="397" font-family="Georgia,serif" font-size="17" fill="#24282b">Posting benchmark; original-</text><text x="670" y="419" font-family="Georgia,serif" font-size="17" fill="#24282b">score earnings weakening</text><text x="670" y="441" font-family="Georgia,serif" font-size="17" fill="#24282b">outside 2020–2021; rounds–SG&amp;A</text><text x="670" y="463" font-family="Georgia,serif" font-size="17" fill="#24282b">check.</text><path d="M594,420 L650,420" fill="none" stroke="#b12d35" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/><text x="20" y="537" font-family="Georgia,serif" font-size="21" font-weight="bold" fill="#24282b">3. Explain differences in reported ghost recruitment</text><rect x="20" y="557" width="575" height="120" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="35" y="584" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Strategic communication</text><text x="35" y="609" font-family="Georgia,serif" font-size="17" fill="#24282b">Present strength to outside stakeholders. Compare competition</text><text x="35" y="631" font-family="Georgia,serif" font-size="17" fill="#24282b">and prior financial or share-price pressure.</text><rect x="655" y="557" width="285" height="120" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="670" y="584" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Financial conditions</text><text x="670" y="609" font-family="Georgia,serif" font-size="17" fill="#24282b">Compustat concentration and</text><text x="670" y="631" font-family="Georgia,serif" font-size="17" fill="#24282b">performance; dated CRSP</text><text x="670" y="653" font-family="Georgia,serif" font-size="17" fill="#24282b">returns.</text><path d="M594,617 L650,617" fill="none" stroke="#b12d35" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/><rect x="20" y="699" width="575" height="120" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="35" y="726" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Hiring plans change</text><text x="35" y="751" font-family="Georgia,serif" font-size="17" fill="#24282b">A genuine search may stop after adverse news. Compare</text><text x="35" y="773" font-family="Georgia,serif" font-size="17" fill="#24282b">uncertainty and industry contraction.</text><rect x="655" y="699" width="285" height="120" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="670" y="726" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Company’s past normal</text><text x="670" y="751" font-family="Georgia,serif" font-size="17" fill="#24282b">Company/year effects; current</text><text x="670" y="773" font-family="Georgia,serif" font-size="17" fill="#24282b">share minus prior three-year</text><text x="670" y="795" font-family="Georgia,serif" font-size="17" fill="#24282b">rate.</text><path d="M594,759 L650,759" fill="none" stroke="#b12d35" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/><rect x="20" y="841" width="575" height="120" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="35" y="868" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Maintain a candidate pipeline</text><text x="35" y="893" font-family="Georgia,serif" font-size="17" fill="#24282b">Recruit for future needs. Compare explicit future-hiring</text><text x="35" y="915" font-family="Georgia,serif" font-size="17" fill="#24282b">statements across job types.</text><rect x="655" y="841" width="285" height="120" rx="12" fill="#f7f8f9" stroke="#6c7277"/><text x="670" y="868" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Recruitment roles</text><text x="670" y="893" font-family="Georgia,serif" font-size="17" fill="#24282b">Compare applicants at the same</text><text x="670" y="915" font-family="Georgia,serif" font-size="17" fill="#24282b">company and year.</text><path d="M594,901 L650,901" fill="none" stroke="#b12d35" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/><rect x="20" y="987" width="920" height="110" rx="12" fill="#e9f2f0" stroke="#6c7277" stroke-dasharray="6 4"/><text x="35" y="1014" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#24282b">Extend with matched positions data</text><text x="35" y="1039" font-family="Georgia,serif" font-size="17" fill="#24282b">Match postings to worker starts. Compare the posting-to-hiring measure with the review score, then test</text><text x="35" y="1061" font-family="Georgia,serif" font-size="17" fill="#24282b">each separately and together in the operating framework.</text><text x="20" y="1123" font-family="Georgia,serif" font-size="16" fill="#24282b">Dotted arrows link questions to measurements; they do not identify causal motives.</text></svg>